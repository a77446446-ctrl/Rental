<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#120f0d">
  <title>Скоро вернёмся | ECO Gorniy</title>
  <link rel="icon" href="/api/icon.png">
  <link rel="apple-touch-icon" sizes="192x192" href="/api/pwa-icon/192.png">
  <link rel="stylesheet" href="/css/main.css?v=20260814-1">
  <link rel="stylesheet" href="/css/maintenance.css?v=20260814-2">
</head>
<body class="maintenance-page">
  <script>try{var theme=localStorage.getItem('siteTheme');if(theme)document.body.classList.add(theme);}catch(error){}</script>
  <div class="noise"></div>
  <div class="top-fade"></div>

  <header class="maintenance-header">
    <a href="#" class="brand" id="main-logo-link" aria-label="Логотип сайта">
      <div class="brand-mark logo-fallback" id="main-logo-img">EG</div>
      <div><strong id="main-logo-text">ECO Gorniy</strong></div>
    </a>
  </header>

  <main class="maintenance-content">
    <div class="maintenance-card">
      <div class="maintenance-emblem" aria-hidden="true">
        <img id="maintenance-hero-logo" src="/api/icon.png" alt="">
      </div>
      <span class="maintenance-kicker">Небольшая пауза</span>
      <h1>Проводятся<br>технические работы</h1>
      <p>Совсем скоро снова будем на связи.</p>
      <p class="maintenance-chat-note">Но вы всегда можете обратиться через наш чат и задать любой вопрос.</p>
    </div>
  </main>

  <div id="chat-widget" class="chat-widget">
    <span id="chat-badge" class="chat-badge" style="display: none;">0</span>
    <div class="chat-header" id="chat-header">
      <span>Связаться с нами</span>
      <button type="button" id="chat-toggle" aria-label="Открыть чат">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"></path></svg>
      </button>
    </div>
    <div class="chat-body" id="chat-body" style="display: none;">
      <div class="chat-messages" id="chat-messages"></div>
      <form class="chat-form" id="chat-form">
        <input type="file" id="chat-file-input" accept="image/*,video/*,audio/*" hidden>
        <button type="button" class="chat-attach-btn" id="chat-attach-btn" title="Прикрепить файл">＋</button>
        <input type="text" id="chat-input" placeholder="Введите сообщение..." autocomplete="off">
        <button type="submit" aria-label="Отправить сообщение">➤</button>
      </form>
    </div>
  </div>

  <div id="chat-toast-banner" class="chat-toast-banner" style="display: none;">Ответ от администратора: вам новое сообщение!</div>
  <div id="toast-container" class="toast-container"></div>

  <script src="/js/api.js?v=20260813-1"></script>
  <script src="/js/admin-entry.js?v=20260813-1"></script>
  <script src="/js/maintenance.js?v=20260814-1"></script>
  <script src="/js/chat.js?v=20260814-1"></script>
</body>
</html>
