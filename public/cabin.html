<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#14120F">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="EcoGorniy">
  <link rel="manifest" href="/api/manifest.json">
  <link rel="icon" href="/api/icon.png">
  <link rel="apple-touch-icon" href="/api/icon.png">
  <title>Подробно о домике | EcoGorniy.ru</title>

  <!-- Google Fonts: Cormorant Garamond & Manrope -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Project Base & Cabin Styles -->
  <link rel="stylesheet" href="/css/main.css?v=20260923-5">
  <link rel="stylesheet" href="/css/cabin.css?v=20261011-1">
</head>
<body class="cabin-page-body" style="background-color: #14120F; color: #F1EADD; margin: 0; padding: 0;">
  <script>try{var _t=localStorage.getItem('siteTheme');if(_t)document.body.classList.add(_t);}catch(e){}</script>
  <div class="noise"></div>

  <div class="cabin-page-container">
    <!-- Header -->
    <header class="cabin-header">
      <a href="/" class="cabin-brand" id="cabinBrandLink" title="На главную">
        <div class="cabin-brand-mark" id="cabin-logo-img">EG</div>
        <div class="cabin-brand-info">
          <strong class="cabin-brand-name" id="cabin-logo-text">Eco-Gorniy</strong>
          <span class="cabin-brand-slogan" id="cabin-logo-slogan">Уединенный отдых</span>
        </div>
      </a>

      <nav class="cabin-nav" id="cabinNav">
        <a href="#about" class="cabin-nav-link">О месте</a>
        <a href="#amenities" class="cabin-nav-link">Удобства</a>
        <a href="#interior" class="cabin-nav-link">Интерьер</a>
        <a href="#exterior" class="cabin-nav-link">Территория</a>
        <a href="#pricing" class="cabin-nav-link">Стоимость</a>
      </nav>

      <button type="button" class="cabin-header-menu-btn" id="cabinMenuBtn" aria-label="Открыть навигацию">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
    </header>

    <!-- Main Content -->
    <main class="cabin-page-wrapper" id="cabinContent">
      <div style="text-align: center; padding: 140px 0; color: #CCC4B6; font-size: 16px;">
        Загрузка информации об объекте...
      </div>
    </main>
  </div>

  <!-- Fullscreen Lightbox Modal -->
  <div class="cabin-lightbox-overlay" id="cabinLightbox" role="dialog" aria-modal="true" aria-label="Просмотр фотографий">
    <div class="cabin-lightbox-backdrop-blur" id="lightboxBlurBg"></div>
    <button type="button" class="cabin-lightbox-close" id="lightboxCloseBtn" aria-label="Закрыть (Esc)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
    
    <button type="button" class="cabin-lightbox-nav cabin-lightbox-prev" id="lightboxPrevBtn" aria-label="Предыдущее фото (←)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
    </button>
    
    <button type="button" class="cabin-lightbox-nav cabin-lightbox-next" id="lightboxNextBtn" aria-label="Следующее фото (→)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <polyline points="9 18 15 12 9 6"></polyline>
      </svg>
    </button>

    <div class="cabin-lightbox-content">
      <div class="cabin-lightbox-img-wrap">
        <img class="cabin-lightbox-img" id="lightboxImg" src="" alt="Фотография">
      </div>
      <div class="cabin-lightbox-meta">
        <div class="cabin-lightbox-caption" id="lightboxCaption"></div>
        <div class="cabin-lightbox-counter" id="lightboxCounter">1 / 1</div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="/js/api.js?v=20260923-5" defer></script>
  <script src="/js/icons.js?v=20260811-2"></script>
  <script src="/js/lucide.min.js?v=20260811-2"></script>
  <script src="/js/cabin.js?v=20261011-3"></script>
  <script src="/js/pwa.js?v=20260811-2" defer></script>
</body>
</html>
